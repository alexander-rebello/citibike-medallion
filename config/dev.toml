# Development: a handful of months that together cover every header and timestamp variant.
env = "dev"

[paths]
raw_root = "~/citibike/data/raw/citibike"          # shared, read-only mirror of the source
manifest = "~/citibike/data/manifest/raw_manifest.jsonl"
lake_root = "~/citibike/lake/dev"                  # bronze/silver/gold for this environment only

[scope]
months = [
  "2013-06",  # quoted header, yyyy-MM-dd HH:mm:ss, duplicate file sets
  "2015-01",  # M/d/yyyy H:mm (no seconds)
  "2016-10",  # Title Case header
  "2018-01",  # fractional seconds, quoted, duplicate file sets
  "2020-01",  # first modern_v2 month
  "2024-06",  # recent, e-bikes
]

[spark]
master = "local[8]"
driver_memory = "6g"
shuffle_partitions = 16

[spark.conf]
# Partitioned writes without the planned sort by year/month: each task keeps up to 8 output files open instead.
# Evidence (docs/performance.md §3): Silver 2019+2024 spill 14 GB -> 0, publish job -36 %, whole run -10 %.
"spark.sql.optimizer.plannedWrite.enabled" = "false"
"spark.sql.maxConcurrentOutputFileWriters" = "8"
