# Schema registry: every raw CSV header seen in the source must be listed here.
# An unknown fingerprint stops the pipeline (see citibike.registry.lookup).
#
# fingerprint = sha256(header.strip().lower())[:16]   (same function as scripts/download_raw.py)
# Several raw spellings can map to one logical schema; Silver has one mapping per logical schema.

[schemas.legacy_v1]
description = "Original Citi Bike format (2013-06 .. 2019-12): trip duration, bike id, user type, birth year, gender"
columns = [
  "tripduration", "starttime", "stoptime",
  "startstationid", "startstationname", "startstationlatitude", "startstationlongitude",
  "endstationid", "endstationname", "endstationlatitude", "endstationlongitude",
  "bikeid", "usertype", "birthyear", "gender",
]
# Observed in samples; verified per file in Silver (the parse rate per pattern is a quality metric).
timestamp_patterns = [
  "yyyy-MM-dd HH:mm:ss.SSSS",  # 2018-2019
  "yyyy-MM-dd HH:mm:ss",       # 2013-2014, 2017
  "M/d/yyyy H:mm:ss",          # 2016
  "M/d/yyyy H:mm",             # 2015 (no seconds -> duration from tripduration)
]

[schemas.modern_v2]
description = "Lyft-era format (2020-01 onwards in the current bucket): ride id, rideable type, member/casual, trip coordinates"
columns = [
  "rideid", "rideabletype", "startedat", "endedat",
  "startstationname", "startstationid", "endstationname", "endstationid",
  "startlat", "startlng", "endlat", "endlng", "membercasual",
]
timestamp_patterns = [
  "yyyy-MM-dd HH:mm:ss.SSS",
  "yyyy-MM-dd HH:mm:ss",
]

[[headers]]
fingerprint = "f42ae6a7191bfe51"
schema = "legacy_v1"
variant = "lowercase, unquoted"
header = "tripduration,starttime,stoptime,start station id,start station name,start station latitude,start station longitude,end station id,end station name,end station latitude,end station longitude,bikeid,usertype,birth year,gender"

