name: prod-pipeline

# Monthly run of the real pipeline on the self-hosted runner. The `prod` environment has required reviewers
# (Settings > Environments > prod), so every run waits for a manual approval before it touches the prod lake.
on:
  schedule:
    - cron: "0 6 5 * *"        # 06:00 UTC on the 5th: last month's file is published in the first days of the month
  workflow_dispatch:
    inputs:
      months:
        description: "Months to ingest, e.g. '2026-10 2026-09' (empty = everything new)"
        required: false
        default: ""
      force:
        description: "Re-ingest months that are already in the ledger"
        type: boolean
        default: false
      cluster:
        description: "Run Spark on the 2-node cluster instead of local mode"
        type: boolean
        default: false

concurrency:
  group: prod-pipeline         # never two prod runs at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: self-hosted
    environment: prod
    timeout-minutes: 240
    env:
      PY: /home/ubuntu/spark-env/bin/python   # the runner service does not read ~/.bashrc
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64
      SPARK_HOME: /opt/spark
      CITIBIKE_ENV: prod
      # inputs go through env vars, never straight into the shell command
      MONTHS: ${{ inputs.months }}
      FORCE: ${{ inputs.force }}
      CLUSTER: ${{ inputs.cluster }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: $PY -m pip install --quiet -r requirements.txt

      - name: Run pipeline
        run: |
          ARGS="--summary"
          if [ -n "$MONTHS" ]; then ARGS="$ARGS --months $MONTHS"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "$CLUSTER" = "true" ]; then export CITIBIKE_SPARK_MASTER=spark://192.168.26.92:7077; fi
          $PY scripts/run_pipeline.py $ARGS

      - name: Show the log of the step that failed
        if: failure()
        run: |
          LOGDIR=$(ls -td ~/citibike/lake/prod/_meta/pipeline_logs/*/ | head -1)
          LAST=$(ls -t "$LOGDIR"*.log | head -1)
          { echo "### Last 40 lines of $(basename "$LAST")"; echo '```'; tail -40 "$LAST"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the run logs
        if: always()
        run: |
          mkdir -p run-logs
          cp -r "$(ls -td ~/citibike/lake/prod/_meta/pipeline_logs/*/ | head -1)". run-logs/ || true
          tail -5 ~/citibike/lake/prod/_meta/pipeline_runs.jsonl > run-logs/last_runs.jsonl || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-logs
          path: run-logs

      # Only after a successful run (Gold checked and published): the dashboard becomes the GitHub Pages site.
      - name: Collect the dashboard for GitHub Pages
        run: |
          mkdir -p site
          cp dashboard/index.html dashboard/data.json site/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish-dashboard:
    needs: run                 # skipped when the pipeline failed: the site keeps the last good dashboard
    runs-on: ubuntu-latest     # only calls the Pages API, no access to the lake needed
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
